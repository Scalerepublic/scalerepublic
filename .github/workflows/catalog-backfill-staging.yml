# Purpose: Incrementally enrich the staging ticker catalog within the university API rate limit.

name: Catalog backfill (staging)

on:
  push:
    branches:
      - dev
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      ticker:
        description: Backfill a single ticker immediately (e.g. COIN)
        required: false
        type: string

concurrency:
  group: catalog-backfill-staging
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill staging market data
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - name: Run catalog backfill
        run: bun run backfill:catalog
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          UNI_API_TOKEN: ${{ secrets.UNI_API_TOKEN }}
          UNI_API_BASE_URL: ${{ secrets.UNI_API_BASE_URL }}
          STOCK_API_PROVIDER: uni
          STOCK_DEBUG: "false"
          BACKFILL_TICKER: ${{ inputs.ticker }}
          CATALOG_BACKFILL_NAMES_PER_TICK: "40"
          CATALOG_BACKFILL_HISTORY_STOCKS_PER_TICK: "12"
          CATALOG_BACKFILL_BARS_PER_STOCK: "30"
          CATALOG_BACKFILL_MAX_API_CALLS: "400"
